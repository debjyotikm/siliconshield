  <text x="363.3333333333333" y="262.41379310344826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111827">Correct</text>
  <rect x="426.0" y="104.48275862068965" width="48" height="137.93103448275863" fill="#2e7d6f"/>
  <text x="450.0" y="96.48275862068965" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">+2</text>
  <text x="450.0" y="262.41379310344826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111827">Fewer FS</text>
  <rect x="512.6666666666667" y="173.44827586206895" width="48" height="68.96551724137932" fill="#2e7d6f"/>
