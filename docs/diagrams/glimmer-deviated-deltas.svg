<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff;" version="1.1" width="640px" height="360px" viewBox="0 0 640 360" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Deviated observation deltas</title>
  <desc id="figure-description">Step-20 weights minus the parent under the trainer path and the SDK path. All bars point up, so the deviated observation improves the three reported metrics in both paths.</desc>
  <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#111827" font-weight="bold">Deviated observation minus parent</text>
  <line x1="60" y1="242.41379310344828" x2="580" y2="242.41379310344828" stroke="#111827"/>
  <text x="190.0" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">Trainer path</text>
  <rect x="79.33333333333334" y="173.44827586206895" width="48" height="68.96551724137932" fill="#2e7d6f"/>
  <text x="103.33333333333334" y="165.44827586206895" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">+1</text>
  <text x="103.33333333333334" y="262.41379310344826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111827">Correct</text>
  <rect x="166.00000000000003" y="173.44827586206895" width="48" height="68.96551724137932" fill="#2e7d6f"/>
  <text x="190.00000000000003" y="165.44827586206895" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">+1</text>
  <text x="190.00000000000003" y="262.41379310344826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111827">Fewer FS</text>
  <rect x="252.66666666666669" y="173.44827586206895" width="48" height="68.96551724137932" fill="#2e7d6f"/>
  <text x="276.6666666666667" y="165.44827586206895" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">+1</text>
  <text x="276.6666666666667" y="262.41379310344826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111827">Triplets</text>
  <text x="450.0" y="314" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111827" font-weight="bold">SDK path</text>
  <rect x="339.3333333333333" y="104.48275862068965" width="48" height="137.93103448275863" fill="#2e7d6f"/>
